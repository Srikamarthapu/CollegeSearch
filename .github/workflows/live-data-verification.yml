name: Live data artifact verification

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-data-artifact-verification
  cancel-in-progress: true

jobs:
  verify-live-artifacts:
    name: Verify pinned first-party artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify live first-party artifacts
        id: verify
        run: |
          rm -f data/institution-source-verification.json
          npm run data:verify-overlays

      - name: Summarize source verification
        if: always() && steps.verify.outcome != 'skipped'
        run: node scripts/summarize-institution-verification.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve source verification report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: institution-source-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/institution-source-verification.json
          if-no-files-found: error
          retention-days: 90
